<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>视频占位符</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            width: 100%;
            background-color: #222;
            color: white;
            font-family: Arial, sans-serif;
            text-align: center;
        }
        
        .content {
            max-width: 80%;
        }
        
        h1 {
            font-size: 24px;
            margin-bottom: 20px;
            color: #4caf50;
        }
        
        p {
            font-size: 16px;
            line-height: 1.5;
        }
        
        .tea-name {
            color: #8bc34a;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <div class="content">
        <h1 id="teaTitle">茶叶视频展示</h1>
        <p>此处应显示<span id="teaName" class="tea-name">茶叶</span>的介绍视频，包括茶叶的生长环境、采摘过程、制作工艺和冲泡方法等内容。</p>
        <p>请上传实际的视频文件替换此占位页面。</p>
    </div>
    
    <script>
        // 从URL获取茶叶名称
        function getParameterByName(name) {
            const url = window.location.href;
            name = name.replace(/[\[\]]/g, '\\$&');
            const regex = new RegExp('[?&]' + name + '(=([^&#]*)|&|#|$)');
            const results = regex.exec(url);
            if (!results) return null;
            if (!results[2]) return '';
            return decodeURIComponent(results[2].replace(/\+/g, ' '));
        }
        
        const teaName = getParameterByName('tea');
        if (teaName) {
            document.getElementById('teaName').textContent = teaName;
            document.getElementById('teaTitle').textContent = teaName + ' 视频展示';
            document.title = teaName + ' - 视频展示';
        }
    </script>
</body>
</html>
